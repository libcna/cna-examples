name: Catalog checks

on:
  push:
  pull_request:

jobs:
  static-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check registrations and documentation
        run: python3 tools/check_catalog.py
      - name: Check demo label positions
        run: python3 tools/check_layout.py
